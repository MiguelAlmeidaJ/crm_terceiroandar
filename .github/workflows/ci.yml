name: CI
on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
